<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10131b"><title>Krávy · Chceš myš?</title><style>
:root{color-scheme:dark;--bg:#10131b;--p:#1b2230;--line:#354154;--ink:#f3f5fa;--muted:#aab4c5;--a:#78dce8;--good:#c4e58a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px}.back{color:var(--a)}h1{font-size:clamp(30px,7vw,42px);margin:12px 0}.lead{color:var(--muted)}.panel{background:var(--p);border:1px solid var(--line);border-radius:16px;padding:17px;margin:14px 0}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{background:#111824;padding:7px 10px;border-radius:9px;font-size:13px}.bar{height:8px;background:#0d121b;border-radius:8px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--a);width:0}.answers{display:grid;gap:9px}.answer,button{background:#293447;color:var(--ink);border:1px solid #45536a;border-radius:11px;padding:12px;text-align:left;font:inherit;cursor:pointer}.answer:disabled{opacity:.8}.answer.correct{border-color:var(--good)}button:disabled{opacity:.5}.feedback{min-height:55px;color:var(--good);padding-top:10px}.next{background:var(--a);color:#101820;font-weight:800;width:100%;text-align:center}.interactive{background:#111824;border:1px solid var(--line);border-radius:13px;padding:14px;margin:12px 0;min-height:110px}.orbit{height:145px;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .4s}.orbit.turned{transform:rotate(180deg)}.planet{font-size:70px}.bird{position:absolute;font-size:44px;top:8px;left:20%}.axis{position:absolute;right:5px;font-size:11px;color:var(--muted)}.chain,.nodes,.feathers,.herd{display:flex;align-items:center;justify-content:center;gap:9px;flex-wrap:wrap;padding:12px}.chain span,.nodes button,.herd button,.feathers button{font-size:23px;min-width:48px;min-height:48px;text-align:center}.nodes button.picked,.herd button.picked,.feathers button.picked{border-color:var(--a);background:#3b5260}.herd small{display:block;font-size:10px}.chain b{color:var(--a)}footer{color:var(--muted);font-size:12px}
</style></head><body data-game="kravy"><main><a class="back" href="index.html">← PORUCHY</a><h1><span id="icon"></span> <span id="name"></span></h1><p class="lead" id="intro"></p><div class="stats"><span id="round">Úloha 1/5</span><span>Body: <b id="score">0</b></span></div><div class="bar"><i id="progress"></i></div><section class="panel"><h2 id="question"></h2><div class="interactive" id="interactive"></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next" hidden>Další úloha →</button></section><footer>Samostatná mobilní hra · Chceš myš? · Prototyp používá lokální JavaScript, neposílá data na server.</footer></main><script src="hry.js"></script></body></html>
